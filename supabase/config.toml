# Local Supabase for development and the end-to-end tests: `npx -y supabase@2.120.0 start`.
# Needs Docker. Applies every file in supabase/migrations, then supabase/seed.sql.
# Only what Wagbook uses is switched on. See docs/10-setup-and-deploy.md.

project_id = "wagbook"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = true
port = 54323

# Catches every email Supabase Auth sends locally (sign-up, reset a password), at
# http://127.0.0.1:54324. The end-to-end tests read the reset link from it (M45).
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[storage.s3_protocol]
enabled = false

[storage.vector]
enabled = false

[analytics]
enabled = false

[edge_runtime]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
# `**` lets the link carry where to go next (?next=...). The tests run the app on 3100.
additional_redirect_urls = ["http://127.0.0.1:3000", "http://localhost:3000/auth/confirm**", "http://localhost:3100/auth/confirm**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# Locally new accounts work at once, with no email to confirm.
enable_confirmations = false


# Supabase Auth keeps its own limits per visitor address (sign-ins, code
# checks), which hold even for someone who skips the app and its limits
# (src/lib/rate-limit.ts). Locally the defaults are left alone: every request
# in the end-to-end tests comes from one address. For a hosted project see
# docs/10-setup-and-deploy.md, "Rate limits".

# Two-step sign-in with an authenticator app (roadmap M9).
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
