# Local Supabase for development and the end-to-end tests: `npx -y supabase@2.120.0 start`.
# Needs Docker. Applies every file in supabase/migrations, then supabase/seed.sql.
# Only what Wagbook uses is switched on. See docs/10-setup-and-deploy.md.

project_id = "wagbook"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = false

[storage]
enabled = true
file_size_limit = "10MiB"

[storage.s3_protocol]
enabled = false

[storage.vector]
enabled = false

[analytics]
enabled = false

[edge_runtime]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://127.0.0.1:3000", "http://localhost:3000/auth/confirm"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# Locally there is no mail server, so new accounts work at once.
enable_confirmations = false
